# 임시 워크플로 — al-folio v1.2 마이그레이션 검증 전용.
# 사이트를 빌드만 하고 배포하지 않는다. master 병합 전에 삭제할 것.
name: TEMP build check (v1.2 migration)

on:
  push:
    branches:
      - sync/al-folio-v1.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Sanity-check output 🔎
        run: |
          set -e
          test -f _site/index.html
          test -f _site/blog/index.html
          test -f _site/blog/2026/one-token-to-fool-judge/index.html
          test -f _site/blog/2026/deep-rl-human-preferences/index.html
          echo "생성된 포스트 페이지 수:"
          find _site/blog -mindepth 3 -name index.html | wc -l
          echo "GA 태그 삽입 확인:"
          grep -c 'G-NH0GKRG1BP' _site/index.html
      - name: Override drift audit 🧷
        run: bundle exec al-folio upgrade audit --no-fail || true
