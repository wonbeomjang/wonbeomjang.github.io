name: Upgrade contract checks

on:
  push:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "test/integration_upgrade_cli.sh"
      - ".github/workflows/upgrade-check.yml"
  pull_request:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "test/integration_upgrade_cli.sh"
      - ".github/workflows/upgrade-check.yml"

jobs:
  upgrade-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      # --no-fail: 이 사이트는 PageSpeed 최적화를 위해 head.liquid / scripts.liquid를
      # 의도적으로 override하며, 그 안에서 구 Bootstrap/jQuery/MDB 런타임 에셋을
      # 직접 참조한다. 감사는 이를 blocking으로 보고하지만 사이트는 정상 동작한다.
      # 리포트는 계속 아티팩트로 올려 드리프트를 추적하되, CI는 막지 않는다.
      # (공식 마이그레이션 가이드도 `upgrade audit --no-fail`을 사용한다.)
      - name: Run upgrade audit 🧪
        run: bundle exec al-folio upgrade audit --no-fail

      - name: Upload upgrade report 📄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-folio-upgrade-report
          path: al-folio-upgrade-report.md
          if-no-files-found: ignore
